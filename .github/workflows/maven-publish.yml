# This workflow will build a package using Maven and publish it to GitHub Packages when a release is created
# For Maven + GitHub Packages setup: https://docs.github.com/en/packages/working-with-a-github-packages-registry

name: Maven Package

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # Needed to publish to GitHub Packages

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        server-id: github  # Must match <id> in <distributionManagement> of pom.xml
        settings-path: ${{ github.workspace }}  # Will generate settings.xml here

    - name: Build with Maven
      run: mvn -B clean package

    - name: Deploy to GitHub Packages
      run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Token auto-provided by GitHub Actions
